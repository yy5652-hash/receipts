[project]
name = "receipts"
version = "0.1.0"
description = "Audit the citations of an AI-generated research report: does the source exist, and does it say this?"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
receipts = "receipts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
