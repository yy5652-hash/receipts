<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>title</title>
<link rel="stylesheet" href="common.css">
<style>
  .wrap { position: absolute; left: 0; right: 0; top: 196px; text-align: center; }
  .mark { width: 128px; height: 128px; margin: 0 auto 14px; color: var(--ink); }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .name { font: 600 190px/1 var(--serif); letter-spacing: -0.03em; margin: 0; }
  .tag { font: 400 46px/1.3 var(--serif); color: var(--ink-2); margin-top: 22px; }
  .by { font: 600 24px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-top: 40px; }
  .chips { position: absolute; left: 0; right: 0; top: 800px; display: flex; justify-content: center; gap: 22px; }
</style></head>
<body>
<div class="wrap">
  <div class="mark" id="mark"></div>
  <h1 class="name" id="name">Receipts</h1>
  <div class="tag" id="tag">Check the citations in AI-written reports.</div>
  <div class="by" id="by">NVIDIA Nemotron on Nebius Token Factory · Tavily</div>
</div>
<div class="chips" id="chips"></div>
<div class="grain"></div>
<div class="veil" id="veil"></div>
<script type="module">
import { $, $$, prog, lerp, line, easeOut, easeBack, badge, LOGO } from "./common.js";
$("#mark").innerHTML = LOGO;
const paths = $$("#mark path");
const lens = paths.map(p => p.getTotalLength());
paths.forEach((p, i) => { p.style.strokeDasharray = lens[i]; });
const order = ["supported", "partial", "contradicted", "not_in_source", "source_unavailable"];
$("#chips").innerHTML = order.map(badge).join("");
const chips = $$("#chips .badge");
window.render = t => {
  const end = window.SCENE_END || 6.5;
  const [t1] = line("t1", [1.8, 5.5]);
  $("#veil").style.opacity = Math.max(1 - prog(t, 0, 0.5), prog(t, end - 0.6, end));
  paths.forEach((p, i) => { p.style.strokeDashoffset = lens[i] * (1 - prog(t, 0.2 + i * 0.35, 1.1 + i * 0.35, easeOut)); });
  const n = prog(t, 0.55, 1.35, easeOut);
  $("#name").style.opacity = n; $("#name").style.transform = `translateY(${lerp(26, 0, n)}px)`;
  const g = prog(t, 0.9, 1.7, easeOut);
  $("#tag").style.opacity = g; $("#tag").style.transform = `translateY(${lerp(20, 0, g)}px)`;
  $("#by").style.opacity = prog(t, 1.2, 1.9);
  chips.forEach((c, i) => {
    const p = prog(t, t1 + 0.5 + i * 0.28, t1 + 0.95 + i * 0.28, easeBack);
    c.style.opacity = Math.min(1, p * 1.6); c.style.transform = `translateY(${lerp(24, 0, Math.min(1, p))}px) scale(${lerp(0.8, 1, p)})`;
  });
};
window.render(0);
window.ready = document.fonts.ready.then(() => true);
</script></body></html>
